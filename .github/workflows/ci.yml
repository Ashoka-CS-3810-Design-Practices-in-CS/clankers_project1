name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck, lint, format, unit and component tests, production build
        run: npm run check
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests (desktop and mobile)
        run: npm run test:e2e
